<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Expense</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

<div class="container py-5">

    <div class="text-center mb-4">
        <h1>✏️ Edit Expense</h1>
        <p class="text-muted">Update your expense details</p>
    </div>

    <div class="card shadow-sm p-4">

        <form method="POST">

            <div class="mb-3">
                <label class="form-label">Expense Title</label>
                <input
                    type="text"
                    name="title"
                    class="form-control"
                    value="{{ expense['title'] }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Amount</label>
                <input
                    type="number"
                    name="amount"
                    class="form-control"
                    step="0.01"
                    value="{{ expense['amount'] }}"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>

                <select name="category" class="form-select" required>
                    <option value="Food" {% if expense['category'] == 'Food' %}selected{% endif %}>Food</option>
                    <option value="Travel" {% if expense['category'] == 'Travel' %}selected{% endif %}>Travel</option>
                    <option value="Shopping" {% if expense['category'] == 'Shopping' %}selected{% endif %}>Shopping</option>
                    <option value="Bills" {% if expense['category'] == 'Bills' %}selected{% endif %}>Bills</option>
                    <option value="Education" {% if expense['category'] == 'Education' %}selected{% endif %}>Education</option>
                    <option value="Other" {% if expense['category'] == 'Other' %}selected{% endif %}>Other</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Date</label>
                <input
                    type="date"
                    name="date"
                    class="form-control"
                    value="{{ expense['date'] }}"
                    required
                >
            </div>

            <button type="submit" class="btn btn-primary w-100">
                Update Expense
            </button>

        </form>

    </div>

</div>

</body>
</html>
